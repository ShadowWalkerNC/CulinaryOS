<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CulinaryOS Monochrome Logo">
  <!-- Outer Hexagon -->
  <polygon points="64,8 114,34 114,94 64,120 14,94 14,34"
           fill="none"
           stroke="#FFFFFF"
           stroke-width="3"
           stroke-linejoin="round" />

  <!-- Inner Plate Wireframe -->
  <polygon points="64,16 106,38 106,90 64,112 22,90 22,38"
           fill="none"
           stroke="#FFFFFF"
           stroke-width="1.2"
           stroke-dasharray="3 3"
           stroke-linejoin="round" />

  <!-- Outer Flame Body (Left + Right combined silhouette) -->
  <path d="M 64,26 
           C 62,38 52,48 48,62 
           C 44,76 49,92 63,98 
           C 54,92 53,82 56,74 
           C 58,68 63,60 64,48 
           C 65,58 70,66 72,74
           C 75,82 74,92 65,98
           C 79,92 84,76 80,62
           C 76,48 66,38 64,26
           Z" 
        fill="#FFFFFF" />

  <!-- Negative Space Cutout Core -->
  <path d="M 64,42
           C 58,54 56,66 64,84
           C 72,66 70,54 64,42
           Z"
        fill="#000000" />

  <!-- Nodes -->
  <circle cx="64" cy="16" r="2.5" fill="#FFFFFF" />
  <circle cx="106" cy="38" r="2" fill="#FFFFFF" />
  <circle cx="106" cy="90" r="2" fill="#FFFFFF" />
  <circle cx="64" cy="112" r="2" fill="#FFFFFF" />
  <circle cx="22" cy="90" r="2" fill="#FFFFFF" />
  <circle cx="22" cy="38" r="2" fill="#FFFFFF" />
</svg>
