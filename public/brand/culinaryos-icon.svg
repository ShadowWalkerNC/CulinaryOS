<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CulinaryOS Icon">
  <defs>
    <!-- Dark Tech Plate Gradient -->
    <linearGradient id="plateBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="1" />
    </linearGradient>

    <!-- Deep Core Hex Fill -->
    <linearGradient id="plateBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Flame Primary Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Flame Core Inner Glow -->
    <linearGradient id="flameCoreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0" />
      <stop offset="60%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Tech Plate (Precision Hexagon) -->
  <polygon points="64,8 114,34 114,94 64,120 14,94 14,34"
           fill="url(#plateBg)"
           stroke="url(#plateBorder)"
           stroke-width="3"
           stroke-linejoin="round" />

  <!-- Inner Plate Wireframe Inset -->
  <polygon points="64,16 106,38 106,90 64,112 22,90 22,38"
           fill="none"
           stroke="#27272A"
           stroke-width="1.5"
           stroke-dasharray="3 3"
           stroke-linejoin="round" />

  <!-- Sovereign Flame Geometry -->
  <!-- Outer Flame Wing (Left) -->
  <path d="M 64,28 
           C 62,38 52,48 48,62 
           C 44,76 49,92 63,98 
           C 54,92 53,82 56,74 
           C 58,68 63,60 64,48 
           Z" 
        fill="url(#flameGrad)" />

  <!-- Main Flame Body & Right Arc -->
  <path d="M 64,26 
           C 68,36 78,44 80,58 
           C 82,72 74,86 64,98 
           C 74,90 75,76 72,66 
           C 70,58 66,48 64,26 
           Z" 
        fill="url(#flameGrad)" />

  <!-- Center Core Flame Spear -->
  <path d="M 64,36
           C 59,50 56,66 64,88
           C 70,72 68,52 64,36
           Z"
        fill="url(#flameCoreGrad)"
        filter="url(#flameGlow)" />

  <!-- Protocol Spark Nodes (Corner Tech Markers) -->
  <circle cx="64" cy="16" r="2.5" fill="#38BDF8" />
  <circle cx="106" cy="38" r="2" fill="#F97316" />
  <circle cx="106" cy="90" r="2" fill="#F97316" />
  <circle cx="64" cy="112" r="2" fill="#F97316" />
  <circle cx="22" cy="90" r="2" fill="#F97316" />
  <circle cx="22" cy="38" r="2" fill="#38BDF8" />
</svg>
