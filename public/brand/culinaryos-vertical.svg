<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="CulinaryOS Vertical Logo">
  <defs>
    <linearGradient id="vPlateBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="vPlateBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="vFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="vCoreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Centered Icon Mark (Origin x=120, y=75) -->
  <g transform="translate(0, -6)">
    <!-- Hex Plate -->
    <polygon points="120,16 168,43 168,97 120,124 72,97 72,43"
             fill="url(#vPlateBg)"
             stroke="url(#vPlateBorder)"
             stroke-width="2.8"
             stroke-linejoin="round" />

    <!-- Inset Dash -->
    <polygon points="120,24 160,46 160,94 120,116 80,94 80,46"
             fill="none"
             stroke="#27272A"
             stroke-width="1.3"
             stroke-dasharray="3 3"
             stroke-linejoin="round" />

    <!-- Left Flame Arc -->
    <path d="M 120,35 
             C 118,45 109,54 105,66 
             C 102,78 107,91 119,96 
             C 111,91 110,82 113,75 
             C 115,69 119,62 120,51 
             Z" 
          fill="url(#vFlameGrad)" />

    <!-- Right Flame Arc -->
    <path d="M 120,33 
             C 123,42 132,50 134,62 
             C 136,75 129,87 120,97 
             C 129,90 130,77 127,69 
             C 125,62 121,53 120,33 
             Z" 
          fill="url(#vFlameGrad)" />

    <!-- Center Core Flame -->
    <path d="M 120,41
             C 116,54 113,68 120,86
             C 125,73 124,56 120,41
             Z"
          fill="url(#vCoreGrad)" />

    <!-- Nodes -->
    <circle cx="120" cy="24" r="2.2" fill="#38BDF8" />
    <circle cx="160" cy="46" r="1.8" fill="#F97316" />
    <circle cx="160" cy="94" r="1.8" fill="#F97316" />
    <circle cx="120" cy="116" r="1.8" fill="#F97316" />
    <circle cx="80" cy="94" r="1.8" fill="#F97316" />
    <circle cx="80" cy="46" r="1.8" fill="#38BDF8" />
  </g>

  <!-- Centered Wordmark -->
  <g text-anchor="middle">
    <text x="120" y="168"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="28"
          font-weight="800"
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Culinary</tspan><tspan fill="#F97316">OS</tspan>
    </text>

    <!-- Tagline -->
    <text x="120" y="194"
          font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
          font-size="9"
          font-weight="600"
          letter-spacing="2.5"
          fill="#A1A1AA">SOVEREIGN RESTAURANT OS</text>

    <!-- Status dot -->
    <circle cx="120" cy="214" r="3" fill="#10B981" />
  </g>
</svg>
