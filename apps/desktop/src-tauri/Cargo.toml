[package]
name = "culinaryos-desktop"
version = "1.3.1"
edition = "2021"
publish = false
description = "CulinaryOS Standalone Native Rust Desktop Workstation & Embedded Local Server"

[[bin]]
name = "culinaryos-desktop"
path = "src/main.rs"

[dependencies]
culinaryos-native = { path = "../../../packages/native" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["serde"] }
