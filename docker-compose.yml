# ============================================================
# CulinaryOS — Unified Monorepo docker-compose
# Usage:
#   cp .env.example .env
#   # Option A (full shared state): `pnpm local:supabase` then fill .env
#   #   (or point SUPABASE_* at a cloud project) and re-up
#   # Option B (demo): leave placeholder Supabase URLs — API uses
#   #   in-memory mock kitchen store; POS fire → KDS poll works
#   docker compose up --build
#
# Note: Postgres is NOT bundled here. Shared multi-client state
# requires Supabase (cloud or `pnpm local:supabase`). Without it, the
# API mock store still bridges POS → KDS for a single-tenant demo.
# ============================================================

version: '3.9'

services:

  # ---- Unified API Gateway Backend (Hono) ----
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: 3000
      SERVICE_NAME: culinaryos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- POS Web Client ----
  pos-client:
    build:
      context: .
      dockerfile: apps/pos/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_POS_URL: ${VITE_POS_URL:-http://localhost:3000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5172:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- KDS Web Client ----
  kds-client:
    build:
      context: .
      dockerfile: apps/kds/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_KDS_URL: ${VITE_KDS_URL:-http://localhost:3000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- Admin Dashboard ----
  admin-client:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- Web Online Ordering ----
  web-client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5176:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
