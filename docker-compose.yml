# ============================================================
# CulinaryOS — Unified Monorepo docker-compose
# Usage:
#   cp .env.example .env   # fill in Supabase credentials
#   docker compose up
# ============================================================

version: '3.9'

services:

  # ---- Unified API Gateway Backend (Hono) ----
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: 3000
      SERVICE_NAME: culinaryos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- KDS Web Client ----
  kds-client:
    build:
      context: .
      dockerfile: apps/kds/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_KDS_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- POS Web Client ----
  pos-client:
    build:
      context: .
      dockerfile: apps/pos/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_POS_URL: http://localhost:3000
    ports:
      - "5172:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- Admin Dashboard ----
  admin-client:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
