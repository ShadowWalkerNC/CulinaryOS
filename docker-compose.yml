# ============================================================
# CulinaryOS — Full Stack docker-compose
# Usage:
#   cp .env.example .env   # fill in Supabase credentials
#   docker compose up
# ============================================================

version: '3.9'

services:

  # ---- CulinaryOS Orchestrator / Event Bus ----
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: 3000
      SERVICE_NAME: culinaryos
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- KDS API ----
  kds:
    build:
      context: .
      dockerfile: kds/Dockerfile
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      PORT: 3002
      SERVICE_NAME: kds
      CULINARYOS_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- POS API ----
  pos:
    build:
      context: .
      dockerfile: pos/Dockerfile
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      PORT: 3003
      SERVICE_NAME: pos
      CULINARYOS_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- RecipeOS API ----
  recipeos:
    build:
      context: .
      dockerfile: recipeos/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: 3001
      SERVICE_NAME: recipeos
      CULINARYOS_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- KDS Web Client ----
  kds-client:
    build:
      context: kds-client
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_KDS_URL: http://localhost:3002
    ports:
      - "5173:80"
    depends_on:
      kds:
        condition: service_healthy
    restart: unless-stopped

  # ---- POS Web Client ----
  pos-client:
    build:
      context: pos-client
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
        VITE_POS_URL: http://localhost:3003
    ports:
      - "5172:80"
    depends_on:
      pos:
        condition: service_healthy
    restart: unless-stopped

  # ---- Admin Dashboard ----
  admin-client:
    build:
      context: admin-client
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TENANT_ID: ${VITE_TENANT_ID}
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
