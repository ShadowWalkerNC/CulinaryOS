[package]
name = "culinaryos-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scrypt = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "json"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["serde"] }

rustls-pemfile = '2'
url = '2'

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

