# ============================================================
# CulinaryOS — Unified Render Blueprint (100% Free Tier)
# Static sites are unlimited free on Render. Web service uses plan: free.
# ============================================================

services:
  # ---- 1. Unified Backend API (Free Instance) ----
  - type: web
    name: culinaryos-api
    runtime: docker
    plan: free
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: SERVICE_NAME
        value: culinaryos
      - key: CULINARYOS_URL
        fromService:
          name: culinaryos-api
          type: web
          property: host
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ---- 2. Customer Online Ordering & Marketing (Free Static Site) ----
  - type: web
    name: culinaryos-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: VITE_API_URL
        fromService:
          name: culinaryos-api
          type: web
          property: host

  # ---- 3. POS Terminal (Free Static Site) ----
  - type: web
    name: culinaryos-pos
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-pos build
    staticPublishPath: apps/pos/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: VITE_API_URL
        fromService:
          name: culinaryos-api
          type: web
          property: host

  # ---- 4. Kitchen Display System (Free Static Site) ----
  - type: web
    name: culinaryos-kds
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-kds build
    staticPublishPath: apps/kds/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: VITE_API_URL
        fromService:
          name: culinaryos-api
          type: web
          property: host

  # ---- 5. Back-Office Admin & Settings (Free Static Site) ----
  - type: web
    name: culinaryos-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/admin build
    staticPublishPath: apps/admin/dist
