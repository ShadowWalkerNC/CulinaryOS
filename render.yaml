# ============================================================
# CulinaryOS — Render Blueprint (pnpm + Turborepo monorepo)
# One-click deploy: connect repo on render.com → "New Blueprint".
#
# After deploy, set these secrets (sync:false) in the Render dashboard:
#   Backend:   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY
#   Frontends: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_TENANT_ID,
#              VITE_API_URL (the deployed backend URL, e.g. https://culinaryos-backend.onrender.com)
# ============================================================

services:

  # ----------------------------------------------------------
  # Unified API gateway — Hono (Docker)
  # ----------------------------------------------------------
  - type: web
    name: culinaryos-backend
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: SERVICE_NAME
        value: culinaryos
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  # ----------------------------------------------------------
  # POS terminal — Vite static site (built from the monorepo)
  # ----------------------------------------------------------
  - type: web
    name: culinaryos-pos
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-pos build
    staticPublishPath: apps/pos/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false

  # ----------------------------------------------------------
  # KDS — Vite static site
  # ----------------------------------------------------------
  - type: web
    name: culinaryos-kds
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-kds build
    staticPublishPath: apps/kds/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false

  # ----------------------------------------------------------
  # Admin back office — Vite static site
  # ----------------------------------------------------------
  - type: web
    name: culinaryos-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/admin build
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false

  # ----------------------------------------------------------
  # Web online ordering — Vite static site
  # ----------------------------------------------------------
  - type: web
    name: culinaryos-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false
