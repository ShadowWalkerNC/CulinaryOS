# ============================================================
# CulinaryOS — Render Cloud Deployment Blueprint
# ============================================================

services:
  # 1. Hono API Backend Service
  - type: web
    name: culinaryos-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install && pnpm --filter @culinaryos/server build
    startCommand: pnpm --filter @culinaryos/server start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: AUTH_RELAXED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 2. Guest Online Storefront
  - type: web
    name: culinaryos-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @culinaryos/app-web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Back-Office Admin Portal
  - type: web
    name: culinaryos-admin
    runtime: static
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @culinaryos/admin build
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
