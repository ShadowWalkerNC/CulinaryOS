# ============================================================
# CulinaryOS — Render Blueprint (apps/* monorepo)
# After deploy, set secrets in the Render dashboard:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY,
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_TENANT_ID,
#   INTERNAL_API_KEY / DEVICE_API_KEY, STRIPE_* as needed
# ============================================================

services:
  - type: web
    name: culinaryos-api
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: SERVICE_NAME
        value: culinaryos
      - key: CULINARYOS_URL
        fromService:
          name: culinaryos-api
          type: web
          property: host
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ---- Frontends (Vite static sites, built from the monorepo) ----
  # Set VITE_API_URL to the deployed API URL (e.g. https://culinaryos-api.onrender.com).
  - type: web
    name: culinaryos-pos
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-pos build
    staticPublishPath: apps/pos/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false

  - type: web
    name: culinaryos-kds
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-kds build
    staticPublishPath: apps/kds/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false

  - type: web
    name: culinaryos-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/admin build
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false

  - type: web
    name: culinaryos-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @culinaryos/app-web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TENANT_ID
        sync: false
      - key: VITE_API_URL
        sync: false
