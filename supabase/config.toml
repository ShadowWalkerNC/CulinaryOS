# CulinaryOS — Supabase local config (minimal)
# Usage: supabase start && pnpm db:reset && pnpm seed

project_id = "culinaryos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seeds/base_tenant.sql", "./seeds/demo.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5172"
additional_redirect_urls = [
  "http://localhost:5172",
  "http://localhost:5173",
  "http://localhost:5174",
  "http://localhost:5176"
]
