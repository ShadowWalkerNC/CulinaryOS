name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'cursor/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, Rust Workspace & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust Cargo Workspace
        run: cargo test --workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: culinaryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      INTERNAL_API_KEY: test-key-ci
      DEVICE_API_KEY: test-device-ci
      AUTH_RELAXED: 'true'
      CULINARYOS_URL: http://localhost:3000
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/culinaryos_test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Bun (server integration runner)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run server integration tests
        run: bun test tests/server/

      - name: Run full test suite
        continue-on-error: false
        run: node ./scripts/run-all-tests.cjs

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/server/Dockerfile -t culinaryos-api:ci .
      - name: Build POS image
        run: docker build -f apps/pos/Dockerfile -t culinaryos-pos:ci .
      - name: Build KDS image
        run: docker build -f apps/kds/Dockerfile -t culinaryos-kds:ci .
