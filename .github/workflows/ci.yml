name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'cursor/**', 'chore/**']
  pull_request:
    branches: [main]

# package.json "packageManager" pins pnpm — do not also pass version: to
# pnpm/action-setup (that conflict fails the job with ERR_PNPM_BAD_PM_VERSION).

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_KEY: test-key-ci
      DEVICE_API_KEY: test-device-ci
      AUTH_RELAXED: 'true'
      CULINARYOS_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Bun (server integration runner)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run server integration tests
        run: bun test tests/server/

      # Broader suite (ratio-engine + tests/**) — surfaces results without
      # blocking until remaining pre-existing failures are cleared.
      - name: Run full test suite (non-blocking)
        continue-on-error: true
        run: node ./scripts/run-all-tests.cjs

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/server/Dockerfile -t culinaryos-api:ci .
      - name: Build POS image
        run: docker build -f apps/pos/Dockerfile -t culinaryos-pos:ci .
      - name: Build KDS image
        run: docker build -f apps/kds/Dockerfile -t culinaryos-kds:ci .
