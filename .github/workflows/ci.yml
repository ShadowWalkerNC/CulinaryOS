name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'cursor/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@culinaryos/server --filter=@culinaryos/shared --filter=@culinaryos/event-bus

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_KEY: test-key-ci
      DEVICE_API_KEY: test-device-ci
      AUTH_RELAXED: 'true'
      CULINARYOS_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run server integration tests
        run: bun test tests/server/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/server/Dockerfile -t culinaryos-api:ci .
      - name: Build POS image
        run: docker build -f apps/pos/Dockerfile -t culinaryos-pos:ci .
      - name: Build KDS image
        run: docker build -f apps/kds/Dockerfile -t culinaryos-kds:ci .
