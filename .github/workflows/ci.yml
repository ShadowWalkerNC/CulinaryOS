name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    # NOTE: run the standalone runner, not `pnpm test` (the turbo `test` task
    # currently recurses into the root `//#test` task). continue-on-error is set
    # because a few pre-existing suites are red (tracked separately); this job
    # surfaces results without blocking until those are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: node ./scripts/run-all-tests.cjs
