openapi: 3.0.3
info:
  title: CulinaryOS Auth API
  description: Authentication and tenant management endpoints — Phase 1
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.culinaryos.com
    description: Production

paths:
  /auth/register:
    post:
      summary: Register a new organization and owner account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgName, restaurantName, timezone, email, password]
              properties:
                orgName:
                  type: string
                  example: Nate's Restaurant Group
                restaurantName:
                  type: string
                  example: The Anchor
                timezone:
                  type: string
                  example: America/New_York
                  description: IANA timezone identifier
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Organization, restaurant, and owner account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already registered
        '422':
          description: Validation error

  /auth/login:
    post:
      summary: Login and receive JWT + refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Rotate refresh token and receive new JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token invalid or expired

  /auth/me:
    get:
      summary: Get current authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT — expires in 15 minutes
        refreshToken:
          type: string
          description: Single-use — expires in 7 days; rotated on each use
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, manager, server, cook, cashier]
        restaurantId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
